name: Buffer Mutation Discovery

# One-off: learn the exact shape of Buffer's post-creation mutation so the
# scheduler can be written against the real schema instead of a guess.
on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Introspect mutations
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ACCESS_TOKE: ${{ secrets.BUFFER_ACCESS_TOKE }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          TOKEN = (os.environ.get("BUFFER_ACCESS_TOKEN") or os.environ.get("BUFFER_ACCESS_TOKE") or "").strip()
          if not TOKEN:
              print("FATAL: Buffer token secret is empty or not set.")
              raise SystemExit(1)
          print(f"token length: {len(TOKEN)}  (value never printed)\n")

          URL = "https://api.buffer.com"

          def gql(query, label):
              body = json.dumps({"query": query}).encode()
              req = urllib.request.Request(
                  URL, data=body, method="POST",
                  headers={"Authorization": f"Bearer {TOKEN}",
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  print(f"[{label}] HTTP {e.code}: {e.read().decode(errors='replace')[:500]}")
              except Exception as e:
                  print(f"[{label}] transport error: {e}")
              return None

          def tname(t):
              """Render a GraphQL type ref like [ChannelId!]! from nested ofType."""
              if not t:
                  return "?"
              k = t.get("kind")
              if k == "NON_NULL":
                  return tname(t.get("ofType")) + "!"
              if k == "LIST":
                  return "[" + tname(t.get("ofType")) + "]"
              return t.get("name") or k

          def base(t):
              """Strip NON_NULL/LIST wrappers down to the named type."""
              while t and t.get("kind") in ("NON_NULL", "LIST"):
                  t = t.get("ofType")
              return (t or {}).get("name")

          TREF = ("{ kind name ofType { kind name ofType { kind name "
                  "ofType { kind name } } } }")

          print("=== 1. Mutation root fields ===")
          d = gql("{ __schema { mutationType { fields { name args { name type %s } } } } }" % TREF, "mut")
          fields = (((d or {}).get("data") or {}).get("__schema") or {}).get("mutationType") or {}
          names = []
          for f in fields.get("fields") or []:
              args = ", ".join(f"{a['name']}: {tname(a['type'])}" for a in f.get("args") or [])
              print(f"  {f['name']}({args})")
              names.append(f["name"])
          print()

          targets = [n for n in names if any(
              k in n.lower() for k in ("post", "draft", "schedule", "publish", "idea"))]
          print("=== 2. Post-related mutations ===")
          print(" ", targets or "none found")
          print()

          seen = set()
          def dump(type_name, depth=0):
              if not type_name or type_name in seen or depth > 3:
                  return
              seen.add(type_name)
              q = ('{ __type(name: "%s") { name kind inputFields { name type %s } '
                   'enumValues { name } } }') % (type_name, TREF)
              r = gql(q, type_name)
              t = ((r or {}).get("data") or {}).get("__type")
              if not t:
                  return
              pad = "  " * (depth + 1)
              if t.get("enumValues"):
                  vals = [e["name"] for e in t["enumValues"]]
                  print(f"{pad}enum {type_name}: {vals}")
                  return
              if not t.get("inputFields"):
                  return
              print(f"{pad}input {type_name} {{")
              children = []
              for f in t["inputFields"]:
                  print(f"{pad}  {f['name']}: {tname(f['type'])}")
                  b = base(f["type"])
                  if b and b not in ("String", "Int", "Float", "Boolean", "ID", "DateTime"):
                      children.append(b)
              print(f"{pad}}}")
              for c in children:
                  dump(c, depth + 1)

          print("=== 3. Input type trees for post mutations ===")
          for f in fields.get("fields") or []:
              if f["name"] not in targets:
                  continue
              print(f"\n--- {f['name']} ---")
              for a in f.get("args") or []:
                  b = base(a["type"])
                  print(f"  arg {a['name']}: {tname(a['type'])}")
                  dump(b, 0)
          PY

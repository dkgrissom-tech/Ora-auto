name: Buffer Return Type
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - env:
          BUFFER_ACCESS_TOKE: ${{ secrets.BUFFER_ACCESS_TOKE }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          T=(os.environ.get("BUFFER_ACCESS_TOKE") or "").strip()
          def gql(q):
              r=urllib.request.Request("https://api.buffer.com",
                  data=json.dumps({"query":q}).encode(), method="POST",
                  headers={"Authorization":f"Bearer {T}","Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(r,timeout=45) as x: return json.loads(x.read())
              except urllib.error.HTTPError as e: return {"http":e.code,"body":e.read().decode()[:400]}
          d=gql('{ __schema { mutationType { fields { name type { kind name ofType { kind name } } } } } }')
          for f in d["data"]["__schema"]["mutationType"]["fields"]:
              if f["name"]=="createPost":
                  print("createPost returns:", json.dumps(f["type"]))
                  rt=f["type"].get("name") or (f["type"].get("ofType") or {}).get("name")
                  print("resolved type name:", rt)
                  d2=gql('{ __type(name: "%s") { kind name possibleTypes { name fields { name } } fields { name } } }' % rt)
                  print(json.dumps(d2, indent=2)[:2500])
          PY

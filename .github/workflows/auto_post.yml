name: Auto-Post (Multi-Brand)

on:
  schedule:
    # Moved off :05 — a legacy n8n flow also fires at :05 UTC and the two
    # could publish the same block twice. Posts are matched by hour, not
    # minute, so the shift changes nothing about when a post is due.
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual posting)'
        type: boolean
        default: false

# Never let two ticks run at once. Without this, a slow run plus the next
# hour's run can double-publish.
concurrency:
  group: auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests atproto

      - name: Run scheduler
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}

          # ===== BUFFER (account-wide, not per brand) =====
          # Publishes Instagram. The secret name was saved truncated in
          # GitHub, so both spellings are passed and the script accepts either.
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ACCESS_TOKE:  ${{ secrets.BUFFER_ACCESS_TOKE }}
          BUFFER_IG_DAILY_CAP: '2'

          # ===== ORA =====
          ORA_BLUESKY_HANDLE:         ${{ secrets.ORA_BLUESKY_HANDLE }}
          ORA_BLUESKY_APP_PASSWORD:   ${{ secrets.ORA_BLUESKY_APP_PASSWORD }}
          ORA_LINKEDIN_ACCESS_TOKEN:  ${{ secrets.ORA_LINKEDIN_ACCESS_TOKEN }}
          ORA_LINKEDIN_AUTHOR_URN:    ${{ secrets.ORA_LINKEDIN_AUTHOR_URN }}
          ORA_META_LONG_TOKEN:        ${{ secrets.ORA_META_LONG_TOKEN }}
          ORA_INSTAGRAM_USER_ID:      ${{ secrets.ORA_INSTAGRAM_USER_ID }}
          ORA_THREADS_USER_ID:        ${{ secrets.ORA_THREADS_USER_ID }}
          ORA_PINTEREST_ACCESS_TOKEN: ${{ secrets.ORA_PINTEREST_ACCESS_TOKEN }}
          ORA_PINTEREST_BOARD_ID:     ${{ secrets.ORA_PINTEREST_BOARD_ID }}
          ORA_PINTEREST_REFRESH_TOKEN: ${{ secrets.ORA_PINTEREST_REFRESH_TOKEN }}
          ORA_PINTEREST_APP_ID: ${{ secrets.ORA_PINTEREST_APP_ID }}
          ORA_PINTEREST_APP_SECRET: ${{ secrets.ORA_PINTEREST_APP_SECRET }}
          ORA_TIKTOK_ACCESS_TOKEN:    ${{ secrets.ORA_TIKTOK_ACCESS_TOKEN }}

          # ===== GRISSOM PRESS =====
          GRISSOM_BLUESKY_HANDLE:         ${{ secrets.GRISSOM_BLUESKY_HANDLE }}
          GRISSOM_BLUESKY_APP_PASSWORD:   ${{ secrets.GRISSOM_BLUESKY_APP_PASSWORD }}
          GRISSOM_LINKEDIN_ACCESS_TOKEN:  ${{ secrets.GRISSOM_LINKEDIN_ACCESS_TOKEN }}
          GRISSOM_LINKEDIN_AUTHOR_URN:    ${{ secrets.GRISSOM_LINKEDIN_AUTHOR_URN }}
          GRISSOM_META_LONG_TOKEN:        ${{ secrets.GRISSOM_META_LONG_TOKEN }}
          GRISSOM_INSTAGRAM_USER_ID:      ${{ secrets.GRISSOM_INSTAGRAM_USER_ID }}
          GRISSOM_THREADS_USER_ID:        ${{ secrets.GRISSOM_THREADS_USER_ID }}
          GRISSOM_PINTEREST_ACCESS_TOKEN: ${{ secrets.GRISSOM_PINTEREST_ACCESS_TOKEN }}
          GRISSOM_PINTEREST_BOARD_ID:     ${{ secrets.GRISSOM_PINTEREST_BOARD_ID }}
          GRISSOM_PINTEREST_REFRESH_TOKEN: ${{ secrets.GRISSOM_PINTEREST_REFRESH_TOKEN }}
          GRISSOM_PINTEREST_APP_ID: ${{ secrets.GRISSOM_PINTEREST_APP_ID }}
          GRISSOM_PINTEREST_APP_SECRET: ${{ secrets.GRISSOM_PINTEREST_APP_SECRET }}
          GRISSOM_TIKTOK_ACCESS_TOKEN:    ${{ secrets.GRISSOM_TIKTOK_ACCESS_TOKEN }}
          # Tumblr is OAuth 1.0a, so it needs the app pair AND the token pair.
          # All five must be set or post_tumblr skips and says which are missing.
          GRISSOM_TUMBLR_BLOG:                ${{ secrets.GRISSOM_TUMBLR_BLOG }}
          GRISSOM_TUMBLR_CONSUMER_KEY:        ${{ secrets.GRISSOM_TUMBLR_CONSUMER_KEY }}
          GRISSOM_TUMBLR_CONSUMER_SECRET:     ${{ secrets.GRISSOM_TUMBLR_CONSUMER_SECRET }}
          GRISSOM_TUMBLR_OAUTH_TOKEN:         ${{ secrets.GRISSOM_TUMBLR_OAUTH_TOKEN }}
          GRISSOM_TUMBLR_OAUTH_TOKEN_SECRET:  ${{ secrets.GRISSOM_TUMBLR_OAUTH_TOKEN_SECRET }}

          # ===== FAMILY BOOK CREATOR =====
          FAMILYBOOK_BLUESKY_HANDLE:         ${{ secrets.FAMILYBOOK_BLUESKY_HANDLE }}
          FAMILYBOOK_BLUESKY_APP_PASSWORD:   ${{ secrets.FAMILYBOOK_BLUESKY_APP_PASSWORD }}
          FAMILYBOOK_LINKEDIN_ACCESS_TOKEN:  ${{ secrets.FAMILYBOOK_LINKEDIN_ACCESS_TOKEN }}
          FAMILYBOOK_LINKEDIN_AUTHOR_URN:    ${{ secrets.FAMILYBOOK_LINKEDIN_AUTHOR_URN }}
          FAMILYBOOK_META_LONG_TOKEN:        ${{ secrets.FAMILYBOOK_META_LONG_TOKEN }}
          FAMILYBOOK_INSTAGRAM_USER_ID:      ${{ secrets.FAMILYBOOK_INSTAGRAM_USER_ID }}
          FAMILYBOOK_THREADS_USER_ID:        ${{ secrets.FAMILYBOOK_THREADS_USER_ID }}
          FAMILYBOOK_PINTEREST_ACCESS_TOKEN: ${{ secrets.FAMILYBOOK_PINTEREST_ACCESS_TOKEN }}
          FAMILYBOOK_PINTEREST_BOARD_ID:     ${{ secrets.FAMILYBOOK_PINTEREST_BOARD_ID }}
          FAMILYBOOK_PINTEREST_REFRESH_TOKEN: ${{ secrets.FAMILYBOOK_PINTEREST_REFRESH_TOKEN }}
          FAMILYBOOK_PINTEREST_APP_ID: ${{ secrets.FAMILYBOOK_PINTEREST_APP_ID }}
          FAMILYBOOK_PINTEREST_APP_SECRET: ${{ secrets.FAMILYBOOK_PINTEREST_APP_SECRET }}
          FAMILYBOOK_TIKTOK_ACCESS_TOKEN:    ${{ secrets.FAMILYBOOK_TIKTOK_ACCESS_TOKEN }}

          # ===== POSTIZ (self-hosted, shared across brands) =====
          # Route Pinterest through Postiz to bypass Pinterest v5's Trial-tier
          # sandbox. POSTIZ_URL + POSTIZ_API_KEY are org-wide; each brand adds
          # its own {BRAND}_POSTIZ_PINTEREST_ID pointing at the Postiz
          # integration ID for that brand's Pinterest account. Missing per-brand
          # ID -> that brand's Pinterest still falls through to Buffer/Bluesky.
          POSTIZ_URL:                        ${{ secrets.POSTIZ_URL }}
          POSTIZ_API_KEY:                    ${{ secrets.POSTIZ_API_KEY }}
          ORA_POSTIZ_PINTEREST_ID:           ${{ secrets.ORA_POSTIZ_PINTEREST_ID }}
          ORA_POSTIZ_PINTEREST_BOARD:        ${{ secrets.ORA_POSTIZ_PINTEREST_BOARD }}
          GRISSOM_POSTIZ_PINTEREST_ID:       ${{ secrets.GRISSOM_POSTIZ_PINTEREST_ID }}
          GRISSOM_POSTIZ_PINTEREST_BOARD:    ${{ secrets.GRISSOM_POSTIZ_PINTEREST_BOARD }}
          FAMILYBOOK_POSTIZ_PINTEREST_ID:    ${{ secrets.FAMILYBOOK_POSTIZ_PINTEREST_ID }}
          FAMILYBOOK_POSTIZ_PINTEREST_BOARD: ${{ secrets.FAMILYBOOK_POSTIZ_PINTEREST_BOARD }}

        run: python scripts/run_scheduler.py

      # Runs even when posting failed, so a partial success is still recorded
      # and cannot be re-sent on the next tick.
      - name: Persist delivery ledger
        if: always()
        run: |
          git config user.name  "ora-auto[bot]"
          git config user.email "ora-auto@users.noreply.github.com"
          git add -f logs/posted.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "ledger unchanged"
            exit 0
          fi
          git commit -q -m "chore(ledger): record delivered posts [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin main && exit 0
            echo "push race, retrying ($i)"
            sleep 5
          done
          echo "::warning::could not persist ledger after 3 attempts"

name: Buffer Status Check

# Confirms what Buffer actually did with recent posts. createPost returning
# "sending" only means Buffer accepted the job, not that the network published
# it — this is how you tell the difference.
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: 'Specific Buffer post id (optional)'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Query Buffer
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ACCESS_TOKE: ${{ secrets.BUFFER_ACCESS_TOKE }}
          POST_ID: ${{ github.event.inputs.post_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          T = (os.environ.get("BUFFER_ACCESS_TOKEN") or os.environ.get("BUFFER_ACCESS_TOKE") or "").strip()
          if not T:
              print("FATAL: Buffer token not set."); raise SystemExit(1)

          def gql(q, v=None):
              req = urllib.request.Request(
                  "https://api.buffer.com",
                  data=json.dumps({"query": q, "variables": v or {}}).encode(),
                  method="POST",
                  headers={"Authorization": f"Bearer {T}", "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return {"httpError": e.code, "body": e.read().decode()[:400]}

          TREF = "{ kind name ofType { kind name ofType { kind name } } }"
          def tn(t):
              if not t: return "?"
              if t["kind"]=="NON_NULL": return tn(t.get("ofType"))+"!"
              if t["kind"]=="LIST": return "["+tn(t.get("ofType"))+"]"
              return t.get("name") or t["kind"]

          for typ in ("PostInput", "PostsInput", "PostsFiltersInput"):
              d = gql('{ __type(name: "%s"){ name inputFields { name type %s } } }' % (typ, TREF))
              t = ((d.get("data") or {}).get("__type"))
              if not t:
                  print(f"{typ}: not found"); continue
              print(f"input {typ} {{")
              for f in t.get("inputFields") or []:
                  print(f"  {f['name']}: {tn(f['type'])}")
              print("}")
              print()
          PY

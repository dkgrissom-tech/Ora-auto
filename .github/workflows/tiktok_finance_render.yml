name: TikTok Finance — Bulk Render

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many scripts to render (0 = all)"
        default: "0"
        required: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu imagemagick

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        run: pip install -r scripts/tiktok_finance/requirements.txt

      - name: Render batch
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          RENDER_LIMIT: ${{ inputs.limit }}
        run: python scripts/tiktok_finance/render_batch.py

      - name: Upload MP4s + captions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-finance-videos
          path: scripts/tiktok_finance/out/
          retention-days: 30
          if-no-files-found: warn

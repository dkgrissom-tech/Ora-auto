name: TikTok Finance — Bulk Render

on:
  workflow_dispatch:
    inputs:
      scripts_file:
        description: "Path to scripts YAML (default: scripts/tiktok_finance/scripts.yaml)"
        default: "scripts/tiktok_finance/scripts.yaml"
        required: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      short-video-maker:
        image: gyoridavid/short-video-maker:latest-tiny
        ports:
          - 3123:3123
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          LOG_LEVEL: info
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      - name: Render batch
        env:
          SVM_API: http://localhost:3123
        run: python scripts/tiktok_finance/render_batch.py

      - name: Upload MP4s + captions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-finance-videos
          path: scripts/tiktok_finance/out/
          retention-days: 30
          if-no-files-found: warn

name: Pinterest Token Diagnostic

# Manual-only. Reads the existing GRISSOM_PINTEREST_ACCESS_TOKEN secret and reports
# WHY Pinterest returns 401, without ever printing the token itself.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Pinterest API
        env:
          TOKEN: ${{ secrets.GRISSOM_PINTEREST_ACCESS_TOKEN }}
          BOARD: ${{ secrets.GRISSOM_PINTEREST_BOARD_ID }}
        run: |
          set +e

          echo "=== 1. Secret shape (no value printed) ==="
          LEN=${#TOKEN}
          echo "token length      : $LEN"
          case "$TOKEN" in
            *[[:space:]]*) echo "whitespace inside : YES  <-- would break the header" ;;
            *)             echo "whitespace inside : no" ;;
          esac
          # Pinterest v5 tokens normally start with pina_
          echo "prefix            : $(printf '%s' "$TOKEN" | cut -c1-5)"
          echo "board id length   : ${#BOARD}"
          echo

          probe () {
            local label="$1" url="$2"
            local body code
            body=$(curl -s -w '\n%{http_code}' -H "Authorization: Bearer $TOKEN" "$url")
            code=$(printf '%s' "$body" | tail -1)
            body=$(printf '%s' "$body" | sed '$d')
            echo "--- $label"
            echo "HTTP $code"
            echo "$body" | head -c 400
            echo; echo
          }

          echo "=== 2. Endpoint probes ==="
          probe "GET /v5/user_account (is the token valid at all?)" \
                "https://api.pinterest.com/v5/user_account"
          probe "GET /v5/boards (does it have boards:read?)" \
                "https://api.pinterest.com/v5/boards?page_size=3"
          if [ -n "$BOARD" ]; then
            probe "GET /v5/boards/\$BOARD (is the board id right?)" \
                  "https://api.pinterest.com/v5/boards/$BOARD"
          fi

          echo "=== 2b. SANDBOX host probe (trial-access apps only work here) ==="
          probe "GET sandbox /v5/user_account" \
                "https://api-sandbox.pinterest.com/v5/user_account"

          echo "=== 3. Interpretation ==="
          echo "user_account 200            -> token is GOOD; the pin payload or board is the problem"
          echo "user_account 401 code 2     -> credential dead: revoked, wrong value, or app lost API access"
          echo "user_account 200 + boards 403 -> token valid but missing boards:read / pins:write scope"
          echo "boards 200 + board id 404   -> wrong GRISSOM_PINTEREST_BOARD_ID"

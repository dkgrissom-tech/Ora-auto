name: Handy Hearts — Render daily book trailer

on:
  schedule:
    # 09:00 and 17:00 America/Chicago = 14:00 and 22:00 UTC
    # (Same slots as toolstack — matches queue.csv time_slot rows.)
    - cron: "0 14 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print plan only, no API call"
        required: false
        default: "false"
      force_post_now:
        description: "Write post block to today UTC / next :20 tick (smoke test)"
        required: false
        default: "false"

concurrency:
  group: handyhearts-render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VIDEOGEN_API_KEY: ${{ secrets.VIDEOGEN_API_KEY }}
      HANDYHEARTS_RENDER_ENABLED: ${{ vars.HANDYHEARTS_RENDER_ENABLED || 'true' }}
      HANDYHEARTS_DRY_RUN: ${{ github.event.inputs.dry_run || vars.HANDYHEARTS_DRY_RUN || 'false' }}
      HANDYHEARTS_FORCE_POST_NOW: ${{ github.event.inputs.force_post_now || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard — kill switch
        if: env.HANDYHEARTS_RENDER_ENABLED != 'true'
        run: |
          echo "HANDYHEARTS_RENDER_ENABLED=$HANDYHEARTS_RENDER_ENABLED — exiting"
          exit 0

      - name: Guard — secret present
        if: env.VIDEOGEN_API_KEY == ''
        run: |
          echo "VIDEOGEN_API_KEY not set — exiting"
          exit 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render next queued trailer
        run: python scripts/generate_handyhearts_short.py

      - name: Commit rendered MP4, queue update, and post block
        run: |
          git config user.name  "handyhearts-bot"
          git config user.email "handyhearts-bot@users.noreply.github.com"
          git add brands/handyhearts/queue.csv brands/handyhearts/assets/*.mp4 brands/handyhearts/learnings/render_costs.csv brands/grissom/posts/*.md || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "handyhearts: render next queued trailer [skip ci]"
            git push
          fi

name: List Buffer Channels (diagnostic)

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Query Buffer channels via known-working endpoint
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
        run: |
          python3 <<'PY'
          import os, json, urllib.request

          token = os.environ["BUFFER_ACCESS_TOKEN"]

          query = """
          {
            account {
              organizations {
                id
                name
                channels {
                  id
                  name
                  service
                  serviceUsername
                  serviceType
                }
              }
            }
          }
          """
          req = urllib.request.Request(
              "https://api.buffer.com",
              data=json.dumps({"query": query, "variables": {}}).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.load(r)

          print("Raw response keys:", list(data.keys()))
          if data.get("errors"):
              print("GraphQL errors:", json.dumps(data["errors"], indent=2))
          orgs = ((data.get("data") or {}).get("account") or {}).get("organizations") or []
          print(f"::notice::Found {len(orgs)} organization(s)")
          print()
          for org in orgs:
              oid = org.get('id','')
              print(f"### Org: {org.get('name')} (id={oid[:8] if oid else '?'}...)")
              channels = org.get("channels") or []
              print(f"    {len(channels)} channels:")
              print(f"    {'SERVICE':<12} {'HANDLE':<35} {'NAME':<30} {'ID'}")
              print("    " + "-" * 100)
              for ch in channels:
                  svc = (ch.get("service") or "").ljust(12)
                  handle = (ch.get("serviceUsername") or "").ljust(35)
                  name = (ch.get("name") or "")[:30].ljust(30)
                  print(f"    {svc} {handle} {name} {ch.get('id')}")
              print()
          PY

name: Buffer Channel Discovery

# Manual-only. Uses BUFFER_ACCESS_TOKEN to list connected channels and Pinterest
# boards, so we can wire the scheduler to real IDs. Never prints the token.
on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Query Buffer GraphQL
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_ACCESS_TOKE: ${{ secrets.BUFFER_ACCESS_TOKE }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          TOKEN = (os.environ.get("BUFFER_ACCESS_TOKEN") or os.environ.get("BUFFER_ACCESS_TOKE") or "").strip()
          if not TOKEN:
              print("FATAL: BUFFER_ACCESS_TOKEN secret is empty or not set.")
              raise SystemExit(1)
          print(f"token length: {len(TOKEN)}  (value never printed)")
          print()

          URL = "https://api.buffer.com"

          def gql(query, label):
              body = json.dumps({"query": query}).encode()
              req = urllib.request.Request(
                  URL, data=body, method="POST",
                  headers={"Authorization": f"Bearer {TOKEN}",
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return json.loads(r.read()), r.status
              except urllib.error.HTTPError as e:
                  raw = e.read().decode(errors="replace")
                  print(f"[{label}] HTTP {e.code}: {raw[:600]}")
                  return None, e.code
              except Exception as e:
                  print(f"[{label}] transport error: {e}")
                  return None, 0

          def introspect_type(name):
              q = ('{ __type(name: "%s") { name kind '
                   'inputFields { name type { name kind ofType { name kind } } } '
                   'fields { name type { name kind ofType { name kind } } } } }') % name
              d, _ = gql(q, f"type:{name}")
              return (d or {}).get("data", {}).get("__type")

          def fmt(fs):
              out = []
              for f in fs or []:
                  t = f["type"]; req = t["kind"] == "NON_NULL"
                  tn = t.get("name") or (t.get("ofType") or {}).get("name") or t["kind"]
                  out.append(f"{f['name']}: {tn}{'!' if req else ''}")
              return out

          print("=== 1. ChannelsInput shape ===")
          ci = introspect_type("ChannelsInput")
          print(fmt(ci.get("inputFields")) if ci else "not found")
          print()

          print("=== 2. Account shape ===")
          ac = introspect_type("Account")
          print(fmt(ac.get("fields")) if ac else "not found")
          print()

          print("=== 3. Probe account / organizations ===")
          for q in ['{ account { id } }',
                    '{ account { id organizations { id name } } }',
                    '{ account { id currentOrganization { id name } } }']:
              d, _ = gql(q, "acct")
              if d and not d.get("errors"):
                  print("OK:", q); print(json.dumps(d["data"], indent=2)[:900])
              elif d:
                  print("ERR:", q, json.dumps(d["errors"])[:200])
          print()

          print("=== 4. channels(input:) attempts ===")
          org = None
          d, _ = gql('{ account { id organizations { id name } } }', "org")
          try:
              org = d["data"]["account"]["organizations"][0]["id"]
              print("organizationId =", org)
          except Exception:
              print("no organizationId discovered")
          attempts = ['{ channels(input: {}) { id name service } }']
          if org:
              attempts += ['{ channels(input: {organizationId: "%s"}) { id name service serviceId } }' % org]
          for q in attempts:
              d, _ = gql(q, "channels")
              if d and not d.get("errors"):
                  print("OK:", q); print(json.dumps(d["data"], indent=2)[:2500])
                  for c in d["data"]["channels"]:
                      if str(c.get("service","")).lower().startswith("pinterest"):
                          bq = ('{ channel(input: {id: "%s"}) { id name metadata { '
                                '... on PinterestMetadata { boards { serviceId name url } } } } }') % c["id"]
                          bd, _ = gql(bq, "boards")
                          print("PINTEREST BOARDS:", json.dumps(bd, indent=2)[:2000])
                  break
              elif d:
                  print("ERR:", json.dumps(d["errors"])[:300])
          print()
          print("=== done ===")
          PY

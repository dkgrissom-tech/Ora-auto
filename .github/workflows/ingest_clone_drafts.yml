name: Ingest Clone Drafts

# Runs :50 of every hour — 15 min before auto_post.yml (:05).
# The ingest script writes into brands/<brand>/posts/YYYY-MM-DD.md and
# commits back, so the existing scheduler tick reads the freshest schedule.
on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (parse + validate only, no commit)'
        type: boolean
        default: false
      brand:
        description: 'Restrict to one brand (leave blank for all)'
        type: choice
        options:
          - ''
          - ora
          - grissom
          - familybook
        default: ''

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # needed to commit updated posts files
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ingest clone drafts
        id: ingest
        run: |
          set -e
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.brand }}" ]; then
            ARGS="$ARGS --brand ${{ github.event.inputs.brand }}"
          fi
          python scripts/ingest_clone_drafts.py $ARGS

      - name: Commit updated posts (if any)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "ora-clone-ingest[bot]"
          git config user.email "ora-clone-ingest@users.noreply.github.com"
          git add brands/ clone_drafts/ logs/ingest.log || true
          if git diff --cached --quiet; then
            echo "No ingest changes to commit."
          else
            git commit -m "chore(ingest): pull clone drafts into brands/*/posts [skip ci]"
            git push
          fi

      - name: Upload ingest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-log
          path: logs/ingest.log
          if-no-files-found: ignore

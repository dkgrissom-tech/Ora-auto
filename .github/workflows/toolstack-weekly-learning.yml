name: Toolstack — Weekly B&B learning

on:
  schedule:
    # Sundays 10:00 America/Chicago = 15:00 UTC
    - cron: "0 15 * * 0"
  workflow_dispatch:

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Score winners and draft next week
        run: python scripts/weekly_learning.py
      - name: Commit updates
        run: |
          git config user.name  "toolstack-bot"
          git config user.email "toolstack-bot@users.noreply.github.com"
          git add brands/toolstack/queue.csv brands/toolstack/learnings/*.csv || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "toolstack: weekly learning pass [skip ci]"
            # Other workflows push to main too; rebase onto them and retry.
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main; then
                git push && exit 0
              else
                git rebase --abort || true
              fi
              sleep $((i * 5))
            done
            exit 1
          fi

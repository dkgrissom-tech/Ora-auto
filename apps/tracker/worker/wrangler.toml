name = "grissom-tracker"
main = "index.ts"
compatibility_date = "2026-01-01"
routes = [{ pattern = "track.grissompress.com/*", zone_name = "grissompress.com" }]

[vars]
SUPABASE_URL = "https://REPLACE_ME.supabase.co"

# Secrets set via wrangler CLI (Don runs these after Supabase project exists):
#   wrangler secret put SUPABASE_SERVICE_KEY
#   wrangler secret put DAILY_SALT
#   wrangler secret put GUMROAD_PING_SECRET

[triggers]
crons = ["0 0 * * *"]
